<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Development Activities | Eduardo Charles Florencio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link href="style.css" rel="stylesheet" />
  <style>
    /* style.css hides the native cursor (the portfolio uses a custom one); restore it on this page */
    *, *::before, *::after { cursor: auto !important; }
    a, a *, button, button * { cursor: pointer !important; }
    .act-topbar {
      position: sticky; top: 0; z-index: 20;
      background: var(--sidebar-bg);
      backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
      border-bottom: 1px solid var(--card-border);
    }
    .act-topbar .inner {
      max-width: 1180px; margin: 0 auto; padding: 1.1rem 1.25rem;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1rem;
    }
    .act-topbar .act-back { justify-self: start; }
    .act-topbar .act-theme { justify-self: end; }
    .act-brand {
      font-family: 'Poppins', sans-serif; font-weight: 800; letter-spacing: .01em;
      font-size: clamp(1.1rem, 3.2vw, 1.9rem); line-height: 1.1; text-align: center;
      color: var(--accent); text-decoration: none; white-space: nowrap;
    }
    .act-brand:hover { color: var(--accent2); }
    .act-back { color: var(--text); text-decoration: none; font-weight: 600; font-size: .9rem; }
    .act-back:hover { color: var(--accent); }
    .act-theme {
      width: 38px; height: 38px; border-radius: 50%;
      border: 1px solid var(--card-border); background: var(--card-bg);
      color: var(--text); cursor: pointer;
    }
    .act-wrap { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
    .act-head {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      gap: 1rem 2rem; margin-bottom: 2.5rem;
    }
    .act-head .btn-repo { justify-self: start; }
    .act-head .section-title { margin: 0; text-align: center; }
    .act-head p { color: var(--text-muted); justify-self: end; text-align: right; max-width: 320px; margin: 0; font-size: .9rem; }
    @media (max-width: 767px) {
      .act-topbar .act-back span { display: none; }
      .act-head { grid-template-columns: 1fr; justify-items: center; text-align: center; }
      .act-head .btn-repo, .act-head p { justify-self: center; text-align: center; order: 3; }
      .act-head .section-title { order: 1; }
    }
    .btn-repo {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .6rem 1.1rem; border-radius: 12px; font-weight: 700; font-size: .85rem;
      color: #fff; text-decoration: none;
      background: linear-gradient(135deg, var(--grad-start), var(--grad-end));
      box-shadow: 0 6px 20px rgba(106,90,205,.3); transition: transform .2s;
    }
    .btn-repo:hover { color: #fff; transform: translateY(-2px); }
    .act-card { padding: 1.5rem; height: 100%; display: flex; flex-direction: column; }
    .act-pill {
      display: inline-block; align-self: flex-start;
      padding: .25rem .8rem; border-radius: 999px; margin-bottom: 1rem;
      background: var(--badge-bg); color: var(--badge-fg);
      font-size: .75rem; font-weight: 700; letter-spacing: .04em;
    }
    .act-preview {
      position: relative; width: 100%; aspect-ratio: 16 / 10;
      border-radius: 14px; overflow: hidden; margin: .25rem 0 1.1rem;
      background: var(--nav-active-bg); border: 1px solid var(--card-border);
      display: flex; align-items: center; justify-content: center;
      color: var(--accent); opacity: .95; font-size: 2.5rem;
    }
    .act-preview.live { background: #000; }
    /* every preview box (live or upcoming) gets the same height => all 4 cards are the same size */
    .act-card .act-preview:not(.live) { flex: none; aspect-ratio: auto; height: var(--prev-h, 22rem); }
    .act-preview iframe {
      position: absolute; top: 0; left: 0; width: 1280px; height: 1000px;
      border: 0; background: #fff; pointer-events: none; transform-origin: top left;
    }
    .act-btn {
      align-self: flex-start; margin-top: auto;
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .55rem 1.1rem; border-radius: 12px;
      font-size: .85rem; font-weight: 700; text-decoration: none;
      color: var(--text); background: var(--badge-bg);
      border: 1px solid var(--card-border); outline: none;
      transition: box-shadow .25s, border-color .25s, transform .25s;
    }
    .act-btn:hover, .act-btn:focus-visible, .act-btn:active {
      color: var(--text); text-decoration: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent), 0 0 18px var(--accent), 0 0 38px rgba(129,140,248,.45);
    }
    .act-btn:active { transform: scale(.97); }
    .act-card.upcoming { opacity: .85; }
    .act-status {
      font-size: .72rem; font-weight: 700; color: var(--text-muted);
      margin-top: auto; min-height: 2.45rem; display: flex; align-items: center; gap: .4rem; /* same height as the View Project button */
    }
  </style>
</head>
<body>
  <header class="act-topbar">
    <div class="inner">
      <a class="act-back" href="index.html#projects"><i class="bi bi-arrow-left"></i> <span>Back to Portfolio</span></a>
      <a class="act-brand" href="index.html">Eduardo Charles Florencio</a>
      <button class="act-theme" id="actTheme" aria-label="Toggle theme"><i class="bi bi-moon-stars-fill"></i></button>
    </div>
  </header>

  <main class="act-wrap">
    <div class="act-head">
      <a class="btn-repo" href="https://github.com/eadweardly/web-development-activities" target="_blank" rel="noopener">
        <i class="bi bi-github"></i> View Repository
      </a>
      <h1 class="section-title">Selected <span class="gradient-text">Works</span></h1>
      <p>My activities and projects for my requirements in Web Development.</p>
    </div>
    <div class="row g-4" id="activityGrid"></div>
  </main>

  <script>
    // To add a new activity: push the folder to the repo, then add one entry here.
    // `folder` is the exact folder name inside the web-development-activities repo.
    // Leave `folder` empty for an upcoming activity.
    const REPO_PAGES = 'https://eadweardly.github.io/web-development-activities/';
    const ACTIVITIES = [
      { no: 1, title: 'Bento Style Page', desc: 'Bento style layout implementation.', folder: 'Act1-Bento' },
      { no: 2, title: 'Empty Passenger', desc: 'Classic car collection', folder: 'Act2-JSON' },
      { no: 3, title: 'Upcoming Activity', desc: 'Details will be added soon.' },
      { no: 4, title: 'Upcoming Activity', desc: 'Details will be added soon.' }
    ];

    const grid = document.getElementById('activityGrid');
    ACTIVITIES.forEach(a => {
      const col = document.createElement('div');
      col.className = 'col-md-6';
      const live = a.folder ? REPO_PAGES + encodeURIComponent(a.folder).replace(/%2F/g, '/') + '/' : '';
      col.innerHTML = `
        <div class="glass-card act-card ${live ? '' : 'upcoming'}">
          <span class="act-pill">Activity ${a.no}</span>
          <h3 class="project-grid-title" style="font-size:1.25rem"></h3>
          <p class="project-grid-desc"></p>
          <div class="act-preview">${live ? '' : '<i class="bi bi-cone-striped"></i>'}</div>
          ${live
            ? `<a class="act-btn" href="${live}" target="_blank" rel="noopener"><i class="bi bi-box-arrow-up-right"></i> View Project</a>`
            : `<span class="act-status"><i class="bi bi-hourglass-split"></i> Coming soon</span>`}
        </div>`;
      col.querySelector('.project-grid-title').textContent = a.title;
      col.querySelector('.project-grid-desc').textContent = a.desc;
      grid.appendChild(col);

      if (live) {
        // Show the WHOLE bento page: render it at desktop width (1280px => 3-column bento),
        // measure its real height, then scale it down so it fits the card exactly.
        const VIEW_W = 1280;
        const box = col.querySelector('.act-preview');
        box.classList.add('live');
        const frame = document.createElement('iframe');
        let pageH = a.previewHeight || 1000;   // fallback if the page can't be measured
        const fit = () => {
          const k = box.clientWidth / VIEW_W;
          frame.style.height = pageH + 'px';
          frame.style.transform = 'scale(' + k + ')';
          box.style.aspectRatio = 'auto';
          box.style.height = Math.round(pageH * k) + 'px';
          grid.style.setProperty('--prev-h', box.style.height);   // other cards copy this height
        };
        frame.addEventListener('load', () => {
          try {
            frame.style.height = '100px';  // shrink first so scrollHeight = real content height
            const d = frame.contentDocument;
            pageH = Math.max(d.documentElement.scrollHeight, d.body.scrollHeight);
          } catch (e) { /* cross-origin (e.g. local preview): keep fallback height */ }
          fit();
        });
        frame.src = live;
        frame.loading = 'lazy';
        frame.tabIndex = -1;
        frame.scrolling = 'no';
        frame.title = a.title + ' preview';
        box.appendChild(frame);
        fit();
        new ResizeObserver(fit).observe(box.parentElement);
      }
    });

    // Theme: shares the same 'theme' key as the main portfolio
    const root = document.documentElement;
    const btn = document.getElementById('actTheme');
    function applyTheme(t) {
      root.setAttribute('data-theme', t);
      btn.innerHTML = t === 'dark' ? '<i class="bi bi-sun-fill"></i>' : '<i class="bi bi-moon-stars-fill"></i>';
    }
    let saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    applyTheme(saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    btn.addEventListener('click', () => {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
  </script>
</body>
</html>
